<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wall Calendar</title>
  <!-- Go straight to the live calendar page on guist as the app's own page.
       (An iframe rendered at its 300x150 default on this TV, so no iframe.)
       The meta refresh needs no JavaScript; the script below is a backup. -->
  <meta http-equiv="refresh" content="0;url=http://192.168.1.177:3020/wall?app=1">
  <script src="$WEBAPIS/webapis/webapis.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #e4d2b8; }
    p { position: absolute; top: 45%; width: 100%; text-align: center; font: 32px Georgia, serif; color: #8b5a2b; }
  </style>
</head>
<body>
  <p>Opening the calendar&hellip;</p>
  <script>
    try {
      webapis.appcommon.setScreenSaver(webapis.appcommon.AppCommonScreenSaverState.SCREEN_SAVER_OFF);
    } catch (e) { /* not on a TV */ }
    location.replace('http://192.168.1.177:3020/wall?app=1');
  </script>
</body>
</html>
