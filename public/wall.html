<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lato:wght@400;700&display=swap">
  <link rel="stylesheet" href="/wall.css">
</head>
<body>
  <div id="stage">
    <aside id="side">
      <div id="clock"></div>
      <div id="date"></div>
      <div id="weather"></div>
      <section class="agenda">
        <h2>Today</h2>
        <ul id="today"></ul>
      </section>
      <section class="agenda">
        <h2>Tomorrow</h2>
        <ul id="tomorrow"></ul>
      </section>
      <div id="legend"></div>
      <div id="status"></div>
      <div id="updated"></div>
      <div id="version"></div>
    </aside>
    <main id="main">
      <h1 id="view-title"></h1>
      <div id="views">
        <div id="view-day" class="view"></div>
        <div id="view-week" class="view"></div>
        <div id="view-month" class="view"></div>
      </div>
    </main>
  </div>
  <script src="/wall.js"></script>
</body>
</html>
